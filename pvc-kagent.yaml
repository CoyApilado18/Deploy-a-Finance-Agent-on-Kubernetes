apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kagent-postgresql
  namespace: kagent
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/name: kagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: local-path
